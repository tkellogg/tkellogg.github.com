<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Snake — Classic & TensorSnake (Three.js)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e1a; font-family: system-ui, sans-serif; }
  #app { width: 100%; height: 100%; }
  #app canvas { display: block; }
  .hud { position: fixed; top: 14px; left: 16px; color: #dfe7ff; font-size: 13px; letter-spacing: .12em; user-select: none; pointer-events: none; }
  .hud b { font-size: 22px; letter-spacing: .02em; }
  #dir { color: #8fa3e8; }
  #mode-name { color: #6ee77e; }
  .hint { position: fixed; bottom: 12px; left: 16px; color: #5a658a; font-size: 12px; user-select: none; pointer-events: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
             background: rgba(5, 8, 18, .55); backdrop-filter: blur(4px); color: #eef2ff; text-align: center; }
  #overlay h1 { margin: 0; font-size: 44px; letter-spacing: .04em; }
  #overlay p { margin: 0; color: #aab4d4; font-size: 15px; }
  #overlay.hidden, #menu.hidden { display: none; }

  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          background: rgba(5, 8, 18, .45); backdrop-filter: blur(4px); color: #eef2ff; text-align: center; }
  #menu h1 { margin: 0; font-size: 52px; letter-spacing: .06em; }
  #menu .tag { margin: 0 0 8px; color: #8a94b8; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; }
  .cards { display: flex; gap: 22px; }
  .mode-card { display: flex; flex-direction: column; gap: 6px; align-items: center; width: 240px; padding: 26px 20px 20px;
               background: #131a2e; color: #eef2ff; border: 1px solid rgba(102, 136, 255, .25); border-radius: 12px;
               cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
               font-family: inherit; }
  .mode-card:hover { transform: translateY(-4px); border-color: rgba(102, 136, 255, .7);
                     box-shadow: 0 16px 34px rgba(0, 0, 0, .45), 0 4px 10px rgba(0, 0, 0, .3); }
  .mode-card .k { font-size: 12px; color: #6d7aa8; border: 1px solid #2c3858; border-radius: 6px; padding: 2px 9px; letter-spacing: .1em; }
  .mode-card .name { font-size: 21px; font-weight: 700; letter-spacing: .06em; margin-top: 4px; }
  .mode-card .desc { font-size: 13px; color: #8a94b8; }
  .mode-card .best { font-size: 12px; color: #5a658a; margin-top: 8px; }
  .mode-card .best b { color: #9fb0e8; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud"><span id="mode-name"></span>&nbsp;&nbsp;·&nbsp;&nbsp;SCORE <b id="score">0</b>&nbsp;&nbsp;·&nbsp;&nbsp;BEST <b id="best">0</b>&nbsp;&nbsp;·&nbsp;&nbsp;<span id="dir">+X</span></div>
<div class="hint">drag: orbit &nbsp;·&nbsp; scroll: zoom &nbsp;·&nbsp; arrows/WASD: steer &nbsp;·&nbsp; Q/E: up/down (tensor only) &nbsp;·&nbsp; space: pause &nbsp;·&nbsp; R: restart &nbsp;·&nbsp; M: menu</div>
<div id="menu">
  <h1>SNAKE</h1>
  <p class="tag">pick your poison</p>
  <div class="cards">
    <button class="mode-card" id="btn-classic">
      <span class="k">PRESS 1</span>
      <span class="name">CLASSIC</span>
      <span class="desc">flat 68×68 plane</span>
      <span class="best">best&nbsp;<b id="best-classic">0</b></span>
    </button>
    <button class="mode-card" id="btn-tensor">
      <span class="k">PRESS 2</span>
      <span class="name">TENSORSNAKE</span>
      <span class="desc">44×44×44 lattice</span>
      <span class="best">best&nbsp;<b id="best-tensor">0</b></span>
    </button>
  </div>
</div>
<div id="overlay" class="hidden"><h1 id="ov-title"></h1><p id="ov-sub"></p></div>
