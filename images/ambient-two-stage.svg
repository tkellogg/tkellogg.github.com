<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Query -->
  <rect x="20" y="130" width="80" height="50" rx="6" fill="#1f2937"/>
  <text x="60" y="161" font-size="13" fill="#fff" text-anchor="middle">query</text>

  <line x1="105" y1="155" x2="135" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Stage 1: wide trapezoid -->
  <path d="M 145 60 L 345 110 L 345 200 L 145 250 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="245" y="140" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">Stage 1</text>
  <text x="245" y="160" font-size="12" fill="#1e3a8a" text-anchor="middle">pooled single-vector</text>
  <text x="245" y="178" font-size="12" fill="#1e3a8a" text-anchor="middle">over 32K-token chunks</text>

  <!-- top-100 label -->
  <text x="375" y="151" font-size="11" fill="#6b7280" text-anchor="middle">top 100</text>
  <line x1="350" y1="155" x2="400" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Stage 2: medium trapezoid -->
  <path d="M 410 110 L 540 130 L 540 180 L 410 200 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="475" y="148" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">Stage 2</text>
  <text x="475" y="166" font-size="11" fill="#92400e" text-anchor="middle">full multi-vector rescore</text>

  <!-- top-3 label -->
  <text x="565" y="151" font-size="11" fill="#6b7280" text-anchor="middle">top 3</text>
  <line x1="545" y1="155" x2="585" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Output: small bar -->
  <rect x="595" y="135" width="140" height="40" rx="5" fill="#dc2626"/>
  <text x="665" y="160" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">8–12 word snippets</text>

  <!-- Annotation under -->
  <text x="380" y="275" font-size="11" fill="#9ca3af" text-anchor="middle" font-style="italic">cheap broad sweep, then expensive precise rescore on a small finalist set</text>
</svg>
