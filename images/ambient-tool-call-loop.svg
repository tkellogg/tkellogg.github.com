<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="system-ui, -apple-system, sans-serif">
  <!-- Lifeline headers -->
  <rect x="40" y="20" width="120" height="34" rx="5" fill="#3b82f6"/>
  <text x="100" y="42" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Agent</text>

  <rect x="240" y="20" width="120" height="34" rx="5" fill="#6b7280"/>
  <text x="300" y="42" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Tool</text>

  <rect x="440" y="20" width="120" height="34" rx="5" fill="#f59e0b"/>
  <text x="500" y="42" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Memory Index</text>

  <!-- Vertical lifelines -->
  <line x1="100" y1="60" x2="100" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="300" y1="60" x2="300" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="500" y1="60" x2="500" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Agent -> Tool: tool call -->
  <line x1="100" y1="100" x2="296" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="198" y="93" font-size="12" fill="#374151" text-anchor="middle">tool call</text>

  <!-- Agent -> Memory: query (automatic) — parallel -->
  <line x1="100" y1="140" x2="496" y2="140" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="133" font-size="12" fill="#b45309" text-anchor="middle" font-style="italic">query (automatic, every call)</text>

  <!-- Tool -> Agent: result (dashed return) -->
  <line x1="300" y1="200" x2="104" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <text x="200" y="193" font-size="12" fill="#6b7280" text-anchor="middle">result</text>

  <!-- Memory -> Agent: snippets (dashed return) -->
  <line x1="500" y1="240" x2="104" y2="240" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <text x="300" y="233" font-size="12" fill="#b45309" text-anchor="middle">3 snippets · 8–12 words each</text>

  <!-- Caption -->
  <text x="300" y="285" font-size="11" fill="#9ca3af" text-anchor="middle" font-style="italic">memory query runs alongside every tool call — agent isn't asking, it just happens</text>
</svg>
