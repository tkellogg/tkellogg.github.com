<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- ========== TOP: Single-vector ========== -->
  <text x="30" y="34" font-size="15" fill="#1f2937" font-weight="600">Single-vector</text>
  <text x="30" y="52" font-size="12" fill="#6b7280">one score per chunk · returns the whole chunk</text>

  <!-- The chunk: one big monolithic box -->
  <rect x="30" y="80" width="280" height="90" rx="6" fill="#3b82f6" opacity="0.85"/>
  <text x="170" y="115" font-size="13" fill="#fff" text-anchor="middle">chunk · ~500 tokens</text>
  <text x="170" y="138" font-size="11" fill="#fff" text-anchor="middle" opacity="0.85">(opaque blob — no internal structure)</text>
  <!-- single score badge -->
  <rect x="245" y="92" width="55" height="22" rx="4" fill="#fff" opacity="0.9"/>
  <text x="272" y="108" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">0.72</text>

  <!-- Arrow -->
  <line x1="335" y1="125" x2="445" y2="125" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="118" font-size="11" fill="#6b7280" text-anchor="middle">return</text>

  <!-- Returned: identical chunk -->
  <rect x="460" y="80" width="280" height="90" rx="6" fill="#3b82f6" opacity="0.85"/>
  <text x="600" y="115" font-size="13" fill="#fff" text-anchor="middle">the entire chunk</text>
  <text x="600" y="138" font-size="11" fill="#fff" text-anchor="middle" opacity="0.85">(same blob, all 500 tokens)</text>

  <!-- Divider -->
  <line x1="30" y1="220" x2="730" y2="220" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ========== BOTTOM: Late-interaction ========== -->
  <text x="30" y="260" font-size="15" fill="#1f2937" font-weight="600">Late-interaction</text>
  <text x="30" y="278" font-size="12" fill="#6b7280">one score per token · returns only the hot window</text>

  <!-- Per-token heatmap. 28 tokens, score peaks in middle around tokens 13-17 -->
  <!-- Each token: 10w gap 1, total 11 per cell. Start at x=30. 28*11 = 308 -->
  <g>
    <!-- Token boxes with score-based fill -->
    <!-- Scores roughly: cool .. cool .. warm .. HOT .. warm .. cool -->
    <!-- I'll inline fills -->
    <rect x="30"  y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="41"  y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="52"  y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="63"  y="310" width="10" height="40" fill="#fef3c7"/>
    <rect x="74"  y="310" width="10" height="40" fill="#fef3c7"/>
    <rect x="85"  y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="96"  y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="107" y="310" width="10" height="40" fill="#fde68a"/>
    <rect x="118" y="310" width="10" height="40" fill="#fcd34d"/>
    <rect x="129" y="310" width="10" height="40" fill="#fbbf24"/>
    <rect x="140" y="310" width="10" height="40" fill="#f59e0b"/>
    <rect x="151" y="310" width="10" height="40" fill="#ea580c"/>
    <rect x="162" y="310" width="10" height="40" fill="#dc2626"/>
    <rect x="173" y="310" width="10" height="40" fill="#dc2626"/>
    <rect x="184" y="310" width="10" height="40" fill="#ea580c"/>
    <rect x="195" y="310" width="10" height="40" fill="#f59e0b"/>
    <rect x="206" y="310" width="10" height="40" fill="#fbbf24"/>
    <rect x="217" y="310" width="10" height="40" fill="#fcd34d"/>
    <rect x="228" y="310" width="10" height="40" fill="#fde68a"/>
    <rect x="239" y="310" width="10" height="40" fill="#fef3c7"/>
    <rect x="250" y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="261" y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="272" y="310" width="10" height="40" fill="#fef3c7"/>
    <rect x="283" y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="294" y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="305" y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="316" y="310" width="10" height="40" fill="#e5e7eb"/>
    <rect x="327" y="310" width="10" height="40" fill="#e5e7eb"/>
  </g>

  <!-- token row label -->
  <text x="30" y="370" font-size="11" fill="#9ca3af">cold</text>
  <text x="178" y="370" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">hot zone</text>
  <text x="337" y="370" font-size="11" fill="#9ca3af" text-anchor="end">cold</text>

  <!-- bracket around hot zone -->
  <path d="M 129 305 L 129 295 L 206 295 L 206 305" fill="none" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Arrow -->
  <line x1="365" y1="330" x2="445" y2="330" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="405" y="323" font-size="11" fill="#6b7280" text-anchor="middle">return</text>

  <!-- Returned: just the hot window -->
  <g>
    <rect x="460" y="310" width="14" height="40" fill="#fcd34d"/>
    <rect x="475" y="310" width="14" height="40" fill="#fbbf24"/>
    <rect x="490" y="310" width="14" height="40" fill="#f59e0b"/>
    <rect x="505" y="310" width="14" height="40" fill="#ea580c"/>
    <rect x="520" y="310" width="14" height="40" fill="#dc2626"/>
    <rect x="535" y="310" width="14" height="40" fill="#dc2626"/>
    <rect x="550" y="310" width="14" height="40" fill="#ea580c"/>
    <rect x="565" y="310" width="14" height="40" fill="#f59e0b"/>
    <rect x="580" y="310" width="14" height="40" fill="#fbbf24"/>
    <rect x="595" y="310" width="14" height="40" fill="#fcd34d"/>
  </g>
  <text x="529" y="370" font-size="11" fill="#6b7280" text-anchor="middle">~10 tokens around the peak</text>

  <!-- Footer caption -->
  <text x="380" y="475" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">
    Same document. Different resolution.
  </text>
  <text x="380" y="495" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">
    Late-interaction lets you keep 8–12 tokens instead of 500.
  </text>
</svg>
