source: .
permalink: /blog/:year/:month/:day/:title
include: [".well-known/"]
highlighter: rouge
exclude:
  - vendor/
  # .codex/skills is a symlink to ../.claude/skills, so the file watcher walks
  # the same tree twice and dies with "directory is already being watched".
  # Neither belongs in the build anyway.
  - .claude/
  - .codex/
repository: https://github.com/tkellogg/tkellogg.github.com

# Bluesky threads collection
collections:
  threads:
    output: true
    permalink: /threads/:name/

# All this needed to insert $$latex$$ in markdown
markdown: kramdown
kramdown:
  math_engine: katex

